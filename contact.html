<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Doe | Contact</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<nav class="navbar">
  <div class="logo">John Doe</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="experience.html">Experience</a>
    <a href="education.html">Education</a>
    <a href="certifications.html">Certifications</a>
    <a href="skills.html">Skills</a>
    <a href="contact.html" class="active">Contact</a>
  </div>
  <button class="btn-primary"><i class="fa-solid fa-download"></i> Download CV</button>
</nav>

<main class="container">
  <h1 class="page-title">Contact</h1>

  <div class="contact-grid">
    <div class="card">
      <div class="card-title">Get in Touch</div>
      <div class="detail-item" style="margin-bottom:12px;"><i class="fa-regular fa-envelope icon"></i><span class="label">Email:</span> john.doe@example.com</div>
      <div class="detail-item" style="margin-bottom:12px;"><i class="fa-solid fa-phone icon"></i><span class="label">Phone:</span> +971 50 123 4567</div>
      <div class="detail-item" style="margin-bottom:12px;"><i class="fa-solid fa-location-dot icon"></i><span class="label">Location:</span> Dubai, UAE</div>
      <div class="detail-item" style="margin-bottom:16px;"><i class="fa-brands fa-linkedin icon"></i><span class="label">LinkedIn:</span> linkedin.com/in/johndoe</div>
      <div class="social-icons">
        <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="#" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        <a href="#" aria-label="Email"><i class="fa-regular fa-envelope"></i></a>
        <a href="#" aria-label="Phone"><i class="fa-solid fa-phone"></i></a>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Send a Message</div>
      <form class="contact-form">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <input type="text" name="subject" placeholder="Subject">
        <textarea name="message" placeholder="Your Message" required></textarea>
        <button type="submit" class="btn-primary" style="align-self:flex-start;"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
